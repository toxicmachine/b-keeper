<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Файл-трейт с информацией о размерах</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Здесь идут обновленные CSS-правила */
    </style>

    <!-- Подключаем Font Awesome -->
    <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
</head>

<body class="container my-5">
    <h1 class="mb-4">Дерево файлов с размером</h1>
    <div class="tree-container">
        <div class="tree-level">
            <i class="fas fa-folder-open icon-folder-open"></i> <span class="folder-name">root</span>
            <span class="size-info">(50 MB)</span>
            <div class="tree-level">
                <i class="fas fa-folder-open icon-folder-open"></i> <span class="folder-name">docs</span>
                <span class="size-info">(20 MB)</span>
                <div class="tree-level">
                    <i class="far fa-file icon-file"></i> <span class="file-name">report.xlsx</span>
                    <span class="size-info">(5 MB)</span>
                </div>
                <div class="tree-level">
                    <i class="far fa-file icon-file"></i> <span class="file-name">contract.pdf</span>
                    <span class="size-info">(15 MB)</span>
                </div>
            </div>
            <div class="tree-level">
                <i class="fas fa-folder-open icon-folder-open"></i> <span class="folder-name">images</span>
                <span class="size-info">(30 MB)</span>
                <div class="tree-level">
                    <i class="far fa-file-image icon-file"></i> <span class="file-name">logo.svg</span>
                    <span class="size-info">(10 KB)</span>
                </div>
                <div class="tree-level">
                    <i class="far fa-file-image icon-file"></i> <span class="file-name">cover.jpg</span>
                    <span class="size-info">(29.99 MB)</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
