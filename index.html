<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Файл-трейт без точек</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Основной стиль контейнера дерева */
        .tree-container {
            font-family: 'Roboto', sans-serif;
            line-height: 1.5em;
        }

        /* Контейнер каждого уровня дерева */
        .tree-level {
            padding-left: 20px;
            position: relative;
        }

        /* Линия-пунктир слева от папок */
        .tree-level.folder::before {
            content: '';
            border-left: 1px dashed rgba(0, 0, 0, 0.1);
            height: 100%;
            position: absolute;
            left: -10px;
            top: 0;
        }

        /* Цвет и вес текста папок */
        .folder-name {
            font-weight: bold;
        }

        /* Выделяем фон при наведении */
        .tree-item:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        /* Иконки папок и файлов */
        .icon-folder-open {
            color: orange;
        }

        .icon-file {
            color: teal;
        }
    </style>

    <!-- Подключаем Font Awesome -->
    <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"></script>
</head>

<body class="container my-5">
    <h1 class="mb-4">Дерево файлов без точек</h1>
    <div class="tree-container">
        <div class="tree-level">
            <i class="fas fa-folder-open icon-folder-open"></i> <span class="folder-name">all_backups (50 GB)</span>
            <div class="tree-level">
                <i class="fas fa-folder-open icon-folder-open"></i> <span class="folder-name">RustProd (20 GB)</span>
                <div class="tree-level">
                    <i class="far fa-file icon-file"></i> <span class="file-name">report.xlsx (5 MB)</span>
                </div>
                <div class="tree-level">
                    <i class="far fa-file icon-file"></i> <span class="file-name">contract.pdf (15 MB)</span>
                </div>
            </div>
            <div class="tree-level">
                <i class="fas fa-folder-open icon-folder-open"></i> <span class="folder-name">Bitrix24 (30 GB)</span>
                <div class="tree-level">
                    <i class="far fa-file-image icon-file"></i> <span class="file-name">logo.svg (10 KB)</span>
                </div>
                <div class="tree-level">
                    <i class="far fa-file-image icon-file"></i> <span class="file-name">cover.jpg (29.99 MB)</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
